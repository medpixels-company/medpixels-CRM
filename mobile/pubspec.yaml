name: medical_crm_mobile
description: "Medical CRM SaaS - Field Reps Offline-First Android App"
publish_to: "none"
version: 1.0.0+100

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Supabase
  supabase_flutter: ^2.8.0
  http: ^1.2.2

  # Offline Database & Secure Storage
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Location & Geofencing
  geolocator: ^13.0.1

  # State Management & DI
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0

  # In-App Auto Update & File Open
  open_filex: ^4.5.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

